name: Set up Go and generate code
description: Installs Go and protoc, generates the protobuf code, and resolves modules.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Install protoc and plugins
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq protobuf-compiler
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
    - name: Generate code and tidy modules
      shell: bash
      run: make generate && go mod tidy
