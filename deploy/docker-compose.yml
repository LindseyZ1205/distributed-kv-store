# A three-node cluster. Build the image first:
#   docker build -f deploy/Dockerfile -t distributed-kv-store:local .
# then: docker compose -f deploy/docker-compose.yml up -d --wait
name: kvstore

x-node: &node
  image: distributed-kv-store:local
  pull_policy: never
  healthcheck:
    # Healthy once this node knows a leader for every shard.
    test: ["CMD", "/usr/local/bin/kvctl", "-addr", "localhost:7000", "-timeout", "2s", "health"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  node1:
    <<: *node
    command: ["-id", "0", "-peers", "node1:7000,node2:7000,node3:7000", "-listen", ":7000", "-data", "/data"]
    volumes: ["node1-data:/data"]
  node2:
    <<: *node
    command: ["-id", "1", "-peers", "node1:7000,node2:7000,node3:7000", "-listen", ":7000", "-data", "/data"]
    volumes: ["node2-data:/data"]
  node3:
    <<: *node
    command: ["-id", "2", "-peers", "node1:7000,node2:7000,node3:7000", "-listen", ":7000", "-data", "/data"]
    volumes: ["node3-data:/data"]

  # Command-line tools inside the cluster network, e.g.
  #   docker compose -f deploy/docker-compose.yml run --rm tools -addr node1:7000 status
  tools:
    image: distributed-kv-store:local
    pull_policy: never
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/kvctl"]

volumes:
  node1-data:
  node2-data:
  node3-data:
